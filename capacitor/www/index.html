<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>테크밋</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: oklch(0.91 0.005 286);
        color: oklch(0.141 0.005 285.823);
        font-family: "Pretendard Variable", -apple-system, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      p {
        margin: 0;
        color: oklch(0.552 0.016 285.938);
        font-size: 14px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        background: oklch(0.21 0.006 285.885);
        color: oklch(1 0 0);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>네트워크 연결을 확인해주세요</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
